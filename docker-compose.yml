version: '3.8'

services:
  bad-data:
    build: .
    container_name: bad-data-party-game
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - HOST_IP=${HOST_IP:-}
      - BASE_URL=${BASE_URL:-}
      - TTS_PROVIDER=${TTS_PROVIDER:-kokoro}
      - KOKORO_TTS_URL=http://kokoro-tts:8880
      - KOKORO_VOICE=${KOKORO_VOICE:-am_michael}
      - ROASTER_VOICE=${ROASTER_VOICE:-am_puck}
      - PIPER_TTS_URL=http://piper-tts:5000
      - PIPER_VOICE=${PIPER_VOICE:-en_US-ryan-high}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - AI_PROVIDER=${AI_PROVIDER:-gemini}
    volumes:
      - ./data:/app/data
    restart: unless-stopped

  # Kokoro-82M Ultra-Realistic Neural Text-To-Speech (Human-Quality Voice Engine)
  kokoro-tts:
    image: ghcr.io/remsky/kokoro-fastapi-cpu:latest
    container_name: bad-data-kokoro-tts
    ports:
      - "8880:8880"
    environment:
      - DEFAULT_VOICE=am_michael
    restart: unless-stopped

  # Piper Neural Text-To-Speech (Lightweight CPU Fallback Voice Host)
  piper-tts:
    image: artibex/piper-http:latest
    container_name: bad-data-piper-tts
    ports:
      - "5000:5000"
    restart: unless-stopped
